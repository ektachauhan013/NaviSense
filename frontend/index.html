<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NaviSense - Spatial Intelligence</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        #video-container {
            position: relative;
            width: 100vw;
            height: 65vh;
            background: black;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        /* --- DEVELOPER TELEMETRY HUD --- */
        #telemetry-hud {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
            text-align: left;
            color: #00ffcc;
            min-width: 200px;
            backdrop-filter: blur(4px);
            display: none; /* Hidden until camera starts */
        }
        .hud-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
        .hud-label { color: #888; }
        .state-CLEAR { color: #00ff00; font-weight: bold; }
        .state-CAUTION { color: #ffcc00; font-weight: bold; }
        .state-STOP { color: #ff0000; font-weight: bold; }
        
        #advice-container {
            height: 35vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #1e1e1e;
        }
        #advice-text {
            font-size: 26px;
            font-weight: bold;
            color: #4CAF50;
            margin-bottom: 20px;
            text-align: center;
            padding: 0 10px;
            transition: color 0.3s ease;
        }
        #start-btn {
            padding: 15px 40px;
            font-size: 18px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        #start-btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="camera" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        
        <!-- Telemetry HUD -->
        <div id="telemetry-hud">
            <div class="hud-row"><span class="hud-label">FPS:</span> <span id="hud-fps">0</span></div>
            <div class="hud-row"><span class="hud-label">Total Latency:</span> <span id="hud-latency">0</span> ms</div>
            <div class="hud-row"><span class="hud-label">Depth Inference:</span> <span id="hud-depth">0</span> ms</div>
            <div class="hud-row"><span class="hud-label">Depth Skipped:</span> <span id="hud-skip">No</span></div>
            <div class="hud-row" style="margin-top: 8px; border-top: 1px solid #444; padding-top: 8px;">
                <span class="hud-label">AI State:</span> <span id="hud-state" class="state-CLEAR">CLEAR</span>
            </div>
        </div>
    </div>

    <div id="advice-container">
        <div id="advice-text">Press Start to begin guidance</div>
        <button id="start-btn">Start NaviSense</button>
    </div>

    <canvas id="capture-canvas" style="display: none;"></canvas>

    <script>
        const video = document.getElementById('camera');
        const overlayCanvas = document.getElementById('overlay');
        const overlayCtx = overlayCanvas.getContext('2d');
        const captureCanvas = document.getElementById('capture-canvas');
        const ctx = captureCanvas.getContext('2d');
        
        const startBtn = document.getElementById('start-btn');
        const adviceText = document.getElementById('advice-text');
        const telemetryHud = document.getElementById('telemetry-hud');

        // HUD Elements
        const hudFps = document.getElementById('hud-fps');
        const hudLatency = document.getElementById('hud-latency');
        const hudDepth = document.getElementById('hud-depth');
        const hudSkip = document.getElementById('hud-skip');
        const hudState = document.getElementById('hud-state');

        let isRunning = false;
        let isProcessing = false;
        
        // Temporal Smoothing Variables
        let adviceHistory = [];
        const SMOOTHING_WINDOW = 3; 
        let lastSpokenAdvice = "";
        let lastSpokenTime = 0;
        
        // FPS Counter
        let lastFrameTime = Date.now();
        let frameCount = 0;

        // --- WEB AUDIO API (For Spatial Sonar Pings) ---
        let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let panner = audioCtx.createStereoPanner();
        panner.connect(audioCtx.destination);

        // Play a directional ping before the voice
        function playDirectionalPing(panValue) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); // High pitch ping
            
            // Smooth fade out to avoid audio popping
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            
            panner.pan.value = panValue; // -0.8 for left, 0.8 for right
            
            osc.connect(gainNode);
            gainNode.connect(panner);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        async function startCamera() {
            try {
                // Request back camera on mobile
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
                video.srcObject = stream;
                startBtn.disabled = true;
                isRunning = true;
                telemetryHud.style.display = "block";
                captureLoop();
            } catch (err) {
                alert("Camera access denied: " + err.message);
            }
        }

        async function captureLoop() {
            if (!isRunning) return;

            // Skip frame if server is busy processing
            if (isProcessing) {
                requestAnimationFrame(captureLoop);
                return;
            }

            const videoWidth = video.videoWidth;
            const videoHeight = video.videoHeight;
            
            if (videoWidth === 0) {
                requestAnimationFrame(captureLoop);
                return;
            }

            // Resize logic (max 640px longest side)
            const maxSide = 640;
            let targetWidth = videoWidth;
            let targetHeight = videoHeight;
            
            if (Math.max(videoWidth, videoHeight) > maxSide) {
                const scale = maxSide / Math.max(videoWidth, videoHeight);
                targetWidth = Math.round(videoWidth * scale);
                targetHeight = Math.round(videoHeight * scale);
            }

            captureCanvas.width = targetWidth;
            captureCanvas.height = targetHeight;
            ctx.drawImage(video, 0, 0, targetWidth, targetHeight);

            captureCanvas.toBlob(async (blob) => {
                if (!blob) return;
                
                isProcessing = true;
                
                const formData = new FormData();
                formData.append("file", blob, "frame.jpg");

                try {
                    const response = await fetch('/analyze-frame', {
                        method: 'POST',
                        body: formData
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        handleResponse(data);
                    }
                } catch (e) {
                    console.error("Network Error:", e);
                } finally {
                    isProcessing = false;
                    
                    // Calculate FPS
                    frameCount++;
                    const now = Date.now();
                    if (now - lastFrameTime >= 1000) {
                        hudFps.innerText = frameCount;
                        frameCount = 0;
                        lastFrameTime = now;
                    }
                }
            }, 'image/jpeg', 0.8);

            // Poll fast, let the backend frame-skipping handle CPU load
            setTimeout(() => requestAnimationFrame(captureLoop), 150); 
        }

        function handleResponse(data) {
            if (data.status === "busy") return;

            // 1. Update Telemetry HUD
            if (data.timing_ms) {
                hudLatency.innerText = data.timing_ms.total;
                hudDepth.innerText = data.timing_ms.depth;
                hudSkip.innerText = data.timing_ms.depth_ran ? "No" : "Yes (Cached)";
            }
            if (data.state) {
                hudState.innerText = data.state;
                hudState.className = `state-${data.state}`;
            }

            // 2. Draw Visual Overlay
            drawOverlay(data.objects);

            // 3. Temporal Smoothing for Voice
            const rawAdvice = data.advice;
            if (!rawAdvice) return; // Advice was suppressed by backend cooldown
            
            adviceHistory.push(rawAdvice);
            if (adviceHistory.length > SMOOTHING_WINDOW) {
                adviceHistory.shift(); 
            }

            if (adviceHistory.length === SMOOTHING_WINDOW) {
                const allMatch = adviceHistory.every(val => val === adviceHistory[0]);
                
                if (allMatch) {
                    const stableAdvice = adviceHistory[0];
                    adviceText.innerText = stableAdvice;
                    
                    // Color code the text based on state
                    if (data.state === "STOP") adviceText.style.color = "#ff4444";
                    else if (data.state === "CAUTION") adviceText.style.color = "#ffcc00";
                    else adviceText.style.color = "#4CAF50";

                    // Speak if new advice, or if 3 seconds have passed
                    const now = Date.now();
                    if (stableAdvice !== lastSpokenAdvice || (now - lastSpokenTime > 3000)) {
                        speak(stableAdvice);
                        lastSpokenAdvice = stableAdvice;
                        lastSpokenTime = now;
                    }
                }
            }
        }

        function drawOverlay(objects) {
            overlayCanvas.width = overlayCanvas.clientWidth;
            overlayCanvas.height = overlayCanvas.clientHeight;
            overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

            const scaleX = overlayCanvas.width / captureCanvas.width;
            const scaleY = overlayCanvas.height / captureCanvas.height;

            objects.forEach(obj => {
                const [x1, y1, x2, y2] = obj.bbox;
                
                const drawX = x1 * scaleX;
                const drawY = y1 * scaleY;
                const drawW = (x2 - x1) * scaleX;
                const drawH = (y2 - y1) * scaleY;

                // Color code based on risk level
                let color = "#00FF00"; // Green
                if (obj.risk_level === "HIGH") color = "#FF0000"; // Red
                else if (obj.risk_level === "MEDIUM") color = "#FFFF00"; // Yellow

                // Draw bounding box
                overlayCtx.strokeStyle = color;
                overlayCtx.lineWidth = 3;
                overlayCtx.strokeRect(drawX, drawY, drawW, drawH);

                // Draw label background
                overlayCtx.fillStyle = color;
                const text = `${obj.label} (${obj.proximity})`;
                overlayCtx.font = "14px 'Courier New', monospace";
                const textWidth = overlayCtx.measureText(text).width;
                overlayCtx.fillRect(drawX, Math.max(0, drawY - 20), textWidth + 8, 20);

                // Draw label text
                overlayCtx.fillStyle = "black";
                overlayCtx.fillText(text, drawX + 4, Math.max(14, drawY - 5));
            });
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); 
                
                // Play spatial ping BEFORE the voice
                if (text.includes("left")) {
                    playDirectionalPing(-0.8); // Left ear
                } else if (text.includes("right")) {
                    playDirectionalPing(0.8);  // Right ear
                }

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.rate = 1.1; 
                window.speechSynthesis.speak(utterance);
            }
        }

        startBtn.addEventListener('click', () => {
            // Resume AudioContext (Required by browser autoplay policies)
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            startCamera();
        });
    </script>
</body>
</html>
